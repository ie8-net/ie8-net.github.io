<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <link rel="stylesheet" href="/css/site.css">
  {{ with .OutputFormats.Get "RSS" }}<link rel="alternate" type="application/rss+xml" title="{{ $.Site.Title }}" href="{{ .RelPermalink }}">{{ end }}
  <link rel="sitemap" href="/sitemap.xml">
  <meta name="theme-color" content="#0f766e">
</head>
<body>
  <div class="progress-bar" id="progress"></div>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="/">{{ .Site.Title }}</a>
      <div class="header-right">
        <nav class="nav">
          {{ range .Site.Menus.main }}
            <a href="{{ .URL }}"{{ if $.IsMenuCurrent "main" . }} class="active"{{ end }}>{{ .Name }}</a>
          {{ end }}
        </nav>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="切换深浅色">深色</button>
      </div>
    </div>
  </header>
  <main class="wrap">
    {{ block "main" . }}{{ end }}
  </main>
  <footer class="site-footer">
    <div class="wrap">
      <p>© {{ now.Year }} {{ .Site.Params.author }} · <a href="/index.xml">RSS 订阅</a> · Powered by Hugo</p>
    </div>
  </footer>
  <button id="to-top" class="to-top" type="button" aria-label="回到顶部">↑ 顶部</button>
  <script>
  (function(){
    var root=document.documentElement;
    var saved=localStorage.getItem('theme');
    if(saved==='dark'||saved==='light'){root.setAttribute('data-theme',saved);}
    var btn=document.getElementById('theme-toggle');
    if(!btn)return;
    function sync(){
      var cur=root.getAttribute('data-theme');
      var prefersDark=window.matchMedia('(prefers-color-scheme: dark)').matches;
      var isDark=(cur==='dark')||(!cur&&prefersDark);
      btn.textContent=isDark?'浅色':'深色';
    }
    sync();
    btn.addEventListener('click',function(){
      var cur=root.getAttribute('data-theme');
      var prefersDark=window.matchMedia('(prefers-color-scheme: dark)').matches;
      var isDark=(cur==='dark')||(!cur&&prefersDark);
      var next=isDark?'light':'dark';
      root.setAttribute('data-theme',next);
      localStorage.setItem('theme',next);
      sync();
    });
    document.querySelectorAll('.post-content pre').forEach(function(pre){
      var b=document.createElement('button');
      b.className='copy-btn';b.type='button';b.textContent='复制';
      b.addEventListener('click',function(){
        navigator.clipboard.writeText(pre.innerText).then(function(){
          b.textContent='已复制';setTimeout(function(){b.textContent='复制';},1200);
        });
      });
      pre.appendChild(b);
    });
  })();

  (function(){
    var bar=document.getElementById('progress');
    var top=document.getElementById('to-top');
    function onScroll(){
      var h=document.documentElement;
      var max=h.scrollHeight-h.clientHeight;
      var pct=max>0?(h.scrollTop/max)*100:0;
      if(bar){bar.style.width=pct+'%';}
      if(top){top.classList.toggle('show',h.scrollTop>400);}
    }
    window.addEventListener('scroll',onScroll,{passive:true});
    onScroll();
    if(top){
      top.addEventListener('click',function(){
        window.scrollTo({top:0,behavior:'smooth'});
      });
    }
  })();

  (function(){
    var toc=document.querySelector('.toc');
    if(!toc)return;
    var links=toc.querySelectorAll('a[href^="#"]');
    if(!links.length)return;
    var map={};
    links.forEach(function(a){
      var id=a.getAttribute('href').slice(1);
      if(id)map[id]=a;
    });
    var targets=Object.keys(map).map(function(id){return document.getElementById(id);}).filter(Boolean);
    if(!targets.length)return;
    var current=null;
    var io=new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if(e.isIntersecting){
          if(current){current.classList.remove('active');}
          current=map[e.target.id];
          if(current){current.classList.add('active');}
        }
      });
    },{rootMargin:'-80px 0px -70% 0px',threshold:0});
    targets.forEach(function(t){io.observe(t);});
  })();
  </script>
</body>
</html>
